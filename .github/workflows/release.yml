name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/Watchtower.Sdk.Tests
      - run: dotnet pack src/Watchtower.Sdk -c Release -o out
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'out/*.nupkg'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.nupkg --generate-notes --verify-tag
      - run: dotnet nuget push 'out/*.nupkg' --source https://nuget.pkg.github.com/watchtowerobservability/index.json --api-key ${{ github.token }}
      # NuGet.org: runs only when the owner has set NUGET_API_KEY.
      - name: NuGet.org
        if: ${{ env.NUGET_API_KEY != '' }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push 'out/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
